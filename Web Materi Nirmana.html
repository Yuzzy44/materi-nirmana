<section class="sec" id="karakteristik"><h2><small>01</small>7 karakteristik titik</h2>
<p>Satu titik dapat berdiri sendiri; ribuan titik dapat membentuk dunia. Titik adalah awal karya visual: susunan titik membangun pola, tekstur, bentuk, dan komposisi tanpa perlu berubah menjadi garis atau bidang. Titik punya tujuh karakteristik: ukuran, bentuk, warna, posisi, jarak, jumlah, dan kepadatan. Coba ubah sendiri di bawah.</p>
<div class="pan"><div class="vis" id="play"></div>
<div class="ctrl">

<label>Jarak <input type="range" id="d" min="14" max="50" value="30"></label>
<label>Jumlah per baris <input type="range" id="n" min="3" max="12" value="7"></label>
<label>Posisi (geser) <input type="range" id="x" min="-120" max="120" value="0"></label>

<div>Warna <span class="row"><button class="sw on" data-co="currentColor" style="background:var(--text)" aria-label="Hitam"></button><button class="sw" data-co="#8a8f9c" style="background:#8a8f9c" aria-label="Abu"></button><button class="sw" data-co="#e63946" style="background:#e63946" aria-label="Merah"></button></span></div>
</div><p class="out" id="out"></p></div></section>

<section class="sec" id="jenis"><h2><small>02</small>Jenis &amp; variasi titik</h2>
<p>Titik dapat divariasikan dalam banyak arah.</p>
<div class="g" id="jg"></div></section>

<section class="sec" id="mata"><h2><small>03</small>Titik mengarahkan mata</h2>
<p>Penataan titik menentukan pusat perhatian, keseimbangan, aliran, ritme, ilusi ruang, dan kualitas tekstur.</p>
<div class="g w" id="mg"></div></section>

<section class="sec" id="teknik"><h2><small>04</small>Teknik &amp; prinsip komposisi</h2>
<p>Tujuh teknik pengolahan titik, lalu tujuh prinsip yang menyatukannya menjadi komposisi.</p>
<div class="g" id="tg7"></div>
<div class="pan" style="margin-top:12px"><div class="lab">Prinsip komposisi</div>
<div class="chips" style="margin:6px 0 0"><span class="chip">Balance · keseimbangan</span><span class="chip">Unity · kesatuan</span><span class="chip">Rhythm · irama</span><span class="chip">Harmony · keselarasan</span><span class="chip">Contrast · kontras</span><span class="chip">Proportion · proporsi</span><span class="chip">Emphasis · penekanan</span></div></div></section>

<section class="sec" id="repetisi"><h2><small>05</small>Repetisi &amp; gradasi</h2>
<p>Repetisi membentuk pola. Gradasi menciptakan dimensi.</p>
<div class="two"><div class="pan"><div class="lab">Teratur</div><div class="vis" id="r1"></div><p class="sm2">Simetris, sistematis.</p></div>
<div class="pan"><div class="lab">Tidak teratur</div><div class="vis" id="r2"></div><p class="sm2">Alami, spontan.</p></div></div>
<div class="pan" style="margin-top:12px"><div class="lab">Gradasi = dimensi</div><div class="vis" id="gd"></div><p class="sm2">kecil → besar · renggang → rapat · terang → gelap</p></div></section>

<section class="sec" id="pointilisme"><h2><small>06</small>Pointilisme ≠ Nirmana Titik</h2>
<div class="two"><div class="card" style="--t:190,235,190"><div class="tile" id="p1"></div><b>Nirmana Titik</b><span>Eksplorasi titik sebagai unsur visual dasar untuk membangun komposisi.</span></div>

  <h1>Bidang &amp; Bentuk</h1>
  <p>Bidang adalah area dua dimensi yang dibatasi garis: punya panjang dan lebar, kedudukan, dan arah, tetapi tanpa tebal. Bentuk adalah wujud yang tampak. Dari persegi, segitiga, dan lingkaran sampai bidang organik dan abstrak, keduanya menjadi dasar setiap komposisi visual.</p>

<section class="sec" id="studio"><h2><small>01</small>Studio bentuk</h2>
<p>Bidang selalu terbentuk oleh pertemuan beberapa goresan garis, warna, atau tekstur yang berbatasan dengan sisi terluarnya. Ia punya luas, tetapi tanpa tebal. Dalam seni rupa, ada dua cara memandang bentuk.</p>
<div class="two" style="margin-bottom:12px"><div class="card" style="--t:157,171,143"><b>Form · sosok</b><span>Wujud nyata yang dijiwai: manusia, binatang, tumbuhan.</span></div>
<div class="card" style="--t:240,110,70"><b>Shape · raut</b><span>Wujud yang hadir tanpa dijiwai atau secara kebetulan. Dibuat karena kegunaan (functional form) atau sebagai ungkapan perasaan (ekspresi).</span></div></div>
<div class="pan">
<div class="row" id="sb"></div>
<div class="vis" id="sp" style="margin-top:12px"></div>
<div class="ctrl">
<label>Ukuran bentuk <input type="range" id="su" min="20" max="130" value="70"></label>
<label>Putar <input type="range" id="sr" min="0" max="360" value="0"></label>
<label>Bingkai (ruang) <input type="range" id="sf" min="35" max="100" value="80"></label>
<div>Tampilan <span class="row"><button class="kb on" data-pn="p">Positif</button><button class="kb" data-pn="n">Negatif</button></span></div>
</div>
<p class="out" id="so"></p></div></section>

<section class="sec" id="jenis"><h2><small>02</small>Jenis bidang &amp; bentuk</h2>
<p>Berdasarkan garis pembatasnya, bidang dibagi menjadi geometris dan non-geometris (plastis). Yang non-geometris terdiri dari organik dan abstrak.</p>
<div class="g w" id="jg"></div>
<div class="two" style="margin-top:12px"><div class="pan"><div class="lab">Ciri bentuk geometris</div><p class="sm2">Garis pembatas berupa garis lurus atau lengkung yang beraturan. Umumnya punya rumus luas matematis yang pasti. Dibuat manusia, dengan tiga bentuk dasar: segitiga, bujur sangkar, lingkaran (basic form).</p></div>
<div class="pan"><div class="lab">Ciri bentuk plastis</div><p class="sm2">Garis pembatas tidak beraturan, sehingga rumus luasnya rumit karena harus menggabungkan beberapa rumus. Banyak dimiliki benda alami: awan, batu, daun.</p></div></div>
</section>

<section class="sec" id="sifat"><h2><small>03</small>Sifat bentuk</h2>
<p>Bentuk dapat dibaca dari dimensinya dan dari gerak yang ia sampaikan.</p>
<div class="g" id="sg"></div>
<div class="pan" style="margin-top:12px"><div class="lab">Tekstur bidang</div><p class="sm2">Tekstur memberi watak pada permukaan bidang yang dapat dilihat dan diraba. Secara umum ada tekstur kasar nyata, kasar semu, ekspresi, dan halus.</p></div></section>

<section class="sec" id="morf"><h2><small>04</small>Metamorfosis bentuk</h2>
<p>Satu bentuk dapat berubah perlahan menjadi bentuk lain. Pilih bentuk awal dan akhir, lalu geser untuk melihat tahapan perubahannya.</p>
<div class="pan">
<div class="row" style="align-items:center"><select id="ma"></select><span>→</span><select id="mb"></select></div>
<div class="vis" id="mp" style="margin-top:10px"></div>
<div class="ctrl"><label>Tahap perubahan <input type="range" id="mt" min="0" max="100" value="0"></label></div>
<div class="th" id="th"></div>
<p class="sm2">Kelima tahap di atas menunjukkan perubahan bertahap dari bentuk awal ke bentuk akhir.</p></div></section>

<section class="sec" id="susun"><h2><small>05</small>Menyusun bentuk</h2>
<p>Sembilan cara dua bentuk berhubungan satu sama lain.</p>
<div class="g" id="ug"></div></section>

<section class="sec" id="pn"><h2><small>06</small>Positif–negatif &amp; irama bidang</h2>
<p>Bidang positif adalah bidang hitam di atas bidang putih. Bidang negatif adalah bagian putihnya. Lihat bagian putih sebagai vas, lalu lihat sebagai dua wajah yang berhadapan.</p>
<div class="two"><div class="pan"><div class="lab">Bidang positif</div><div class="vis" id="v1"></div></div><div class="pan"><div class="lab">Bidang negatif</div><div class="vis" id="v2"></div></div></div>
<div class="pan" style="margin-top:12px"><div class="lab">Irama bidang</div>
<div class="rw"><em>Statis</em><div class="vis" id="i1"></div></div>
<div class="rw"><em>Dinamis</em><div class="vis" id="i2"></div></div>
<div class="rw"><em>Terarah</em><div class="vis" id="i3"></div></div></div>
<div class="pan" style="margin-top:12px"><div class="lab">Ilusi ruang dari bidang</div>
<p class="sm2" style="margin:0 0 8px">Papan kotak-kotak hitam putih bisa tampak menggembung hanya dengan mengubah ukuran bidang dari tengah ke tepi.</p>
<div class="vis" id="op" style="max-width:320px;margin:0 auto"></div>
<div class="ctrl"><label>Kelengkungan <input type="range" id="ok" min="0" max="30" value="18"></label></div></div>
<div class="g w" style="margin-top:12px"><div class="card" style="--t:157,171,143"><b>Memberi batas</b><span>Memisahkan area yang satu dari area yang lain.</span></div><div class="card" style="--t:240,110,70"><b>Membagi ruang</b><span>Membatasi ruang positif dan ruang negatif.</span></div><div class="card" style="--t:233,223,201"><b>Memberi outline</b><span>Dengan bantuan garis untuk menegaskan tepinya.</span></div></div></section>

<section class="sec" id="prinsip"><h2><small>07</small>Prinsip keindahan bentuk</h2>
<p>Bentuk-bentuk yang baik tidak berdiri sendiri; ia disusun dengan prinsip.</p>
<div class="g w" id="pg"></div>
<div class="two" style="margin-top:12px"><div class="pan"><div class="lab">Kesatuan (unity)</div><p class="sm2">Keselarasan unsur-unsur yang disusun, baik dalam wujudnya maupun kaitannya dengan ide yang melandasinya. Enam pendekatan:</p><div class="chips" style="margin:8px 0 0"><span class="chip">Kesamaan</span><span class="chip">Kemiripan</span><span class="chip">Keselarasan</span><span class="chip">Pengkaitan</span><span class="chip">Pengikatan</span><span class="chip">Kerapatan</span></div></div>
<div class="pan"><div class="lab">Dominasi</div><p class="sm2">Menarik perhatian, menghilangkan kebosanan, dan memecah keberaturan. Cara memperolehnya:</p><div class="chips" style="margin:8px 0 0"><span class="chip">Kontras discord</span><span class="chip">Kontras ekstrem</span><span class="chip">Anomali / keunikan</span><span class="chip">Keunggulan / kekuatan</span></div></div></div>
<div class="pan" style="margin-top:12px"><div class="lab">Proporsi &amp; skala</div><p class="sm2">Proporsi adalah perbandingan ukuran yang serasi antara satu bagian dan bagian lain; tidak ada ukuran pasti. Skala adalah perubahan ukuran tanpa mengubah perbandingan panjang, lebar, atau tinggi, sehingga memberi kesan luas, jauh, sedang, sempit, atau dekat. Ukuran sendiri bersifat nisbi, tergantung area tempat bentuk itu berada.</p><div class="vis" id="ps" style="max-width:420px"></div></div></section>

<section class="sec" id="kesimpulan"><h2><small>08</small>Kesimpulan</h2>
<div class="pan"><p class="quote">Bidang adalah garis yang menutup diri. Bentuk adalah keputusan tentang apa yang dibatasi dan apa yang dibiarkan kosong.</p>
<div class="chips"><span class="chip">Geometris &amp; plastis</span><span class="chip">2D &amp; 3D</span><span class="chip">Positif &amp; negatif</span><span class="chip">Kesatuan &amp; dominasi</span></div>
<div class="row"><button class="btn fill">Coba Kuis Bidang &amp; Bentuk</button><button class="btn">Lihat Contoh Lain</button></div></div>

<section id="apa"><h2><small>01</small>Apa itu warna</h2>
<p class="lead">Warna adalah spektrum tertentu dalam cahaya sempurna (putih). Identitasnya ditentukan panjang gelombang cahaya.</p>
<div class="grid"><div class="card"><h3>Secara fisik</h3><p>Sifat cahaya yang dipancarkan, dapat diperikan lewat panjang gelombang. Cahaya tampak hanyalah bagian sempit dari gelombang elektromagnetik.</p></div>
<div class="card"><h3>Secara psikologis</h3><p>Bagian dari pengalaman indra penglihatan. Pilihan warna memengaruhi kesan pembaca, suasana hati, dan keindahan desain.</p></div></div>
<div class="grid" style="margin-top:12px"><div class="card"><span class="sw" style="background:#e11d48"></span><h3>Benda merah</h3><p>Pigmennya memantulkan merah dan menyerap warna lain.</p></div>
<div class="card"><span class="sw" style="background:#111"></span><h3>Benda hitam</h3><p>Pigmennya menyerap semua warna pelangi dalam spektrum.</p></div>
<div class="card"><span class="sw" style="background:#fff"></span><h3>Benda putih</h3><p>Pigmennya memantulkan semua warna pelangi atau semua panjang gelombang.</p></div></div></section>

<section id="cahaya"><h2><small>02</small>Warna additive &amp; subtractive</h2>
<p class="lead">Menurut asal kejadiannya, warna dibagi dua. Nyalakan tiap lingkaran dan lihat hasil campurannya.</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
<div class="card"><h3>Additive — cahaya (RGB)</h3><p>Berasal dari cahaya spektrum. Merah, hijau, dan biru dalam jumlah sama menghasilkan putih.</p><div class="stage" style="margin-top:10px" id="sa"><i class="r on"></i><i class="g on"></i><i class="b"></i></div>
<div class="row" id="ad"><button class="btn on" data-k="r">Merah</button><button class="btn on" data-k="g">Hijau</button><button class="btn" data-k="b">Biru</button></div><div class="res" id="ra"></div></div>
<div class="card"><h3>Subtractive — pigmen (CMY/CMYK)</h3><p>Berasal dari pigmen transparan. Primernya sian, magenta, dan kuning. K pada CMYK bukan warna, melainkan unsur gelap (black).</p><div class="stage" style="margin-top:10px" id="ss"><i class="c on"></i><i class="m on"></i><i class="y"></i></div>
<div class="row" id="su"><button class="btn on" data-k="c">Sian</button><button class="btn on" data-k="m">Magenta</button><button class="btn" data-k="y">Kuning</button></div><div class="res" id="rs"></div></div></div></section>

<section id="dimensi"><h2><small>03</small>Tiga dimensi warna</h2>
<p class="lead">Hue, value, dan chroma sangat memengaruhi tata rupa. Geser untuk merasakannya.</p>
<div class="two"><div><div id="hue"></div><div class="res" id="hr"></div></div><div>
<label>Hue — rona, nama dan jenis warna<input type="range" id="h" min="0" max="360" value="340"></label>
<label>Value — terang-gelap, tua-muda (lightness)<input type="range" id="l" min="8" max="92" value="50"></label>
<label>Chroma — cerah-redup, intensitas (saturation)<input type="range" id="s" min="0" max="100" value="80"></label></div></div></section>

<section id="campur"><h2><small>04</small>Pencampuran warna bahan</h2>
<p class="lead">Dari tiga warna primer lahir sekunder, tersier, hingga kuarter. Bila semua dicampur, hasilnya hitam (gelap).</p>
<div class="grid" style="margin-bottom:14px"><div class="card"><h3>Tinta cetak</h3><p>Print komputer dan offset. Primer: cyan, magenta, yellow (CMY).</p></div><div class="card"><h3>Cat</h3><p>Cat air, poster, akrilik, minyak. Primer dalam praktik: kuning, merah, biru.</p></div></div>
<div id="mix" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))"></div></section>

<section id="klas"><h2><small>05</small>Klasifikasi warna</h2>
<p class="lead">Ada lima klasifikasi warna.</p><div id="kl" class="grid"></div></section>

<section id="panas"><h2><small>06</small>Warna panas &amp; dingin</h2>
<p class="lead">Dua belas warna (3 primer, 3 sekunder, 6 intermediate) disusun melingkar, lalu dibelah menjadi dua daerah.</p>
<div class="two"><div><div class="row" id="wf"><button class="btn p" data-f="all">Semua</button><button class="btn" data-f="w">Panas</button><button class="btn" data-f="c">Dingin</button></div><svg id="wheel" viewBox="0 0 320 320" role="img" aria-label="Lingkaran 12 warna"></svg></div>
<div><div class="card" style="margin-bottom:10px"><h3>Panas</h3><p>Merah, jingga, kuning. Kesan semangat, kuat, dan aktif.</p></div><div class="card" style="margin-bottom:10px"><h3>Dingin</h3><p>Biru, ungu, hijau. Kesan tenang, kalem, dan pasif. Terlalu banyak warna dingin terkesan sedih dan melankoli.</p></div><div class="card"><h3>Bisa bergeser</h3><p>Hijau menghangat ke arah kuning-kehijauan, ungu menghangat ke arah ungu-kemerahan. Panas dan dingin saling berkomplemen, sehingga kontras.</p></div></div></div></section>

<section id="arti"><h2><small>07</small>Warna &amp; artinya</h2>
<p class="lead">Setiap warna punya profil identitasnya sendiri. Pilih satu.</p>
<div class="row" id="ac"></div><div class="card" id="ad2"></div></section>

/* bentuk dalam koordinat polar */
const SH={
 lingkaran:{n:'Lingkaran',k:'bergerak',f:t=>1},
 persegi:{n:'Persegi',k:'stabil',f:t=>.85/Math.max(Math.abs(Math.cos(t)),Math.abs(Math.sin(t)))},
 segitiga:{n:'Segitiga',k:'terarah',f:t=>.62/Math.max(...[270,30,150].map(a=>Math.cos(t-rad(a))))},
 organik:{n:'Organik',k:'mengalir dan hidup (biomorphic)',f:t=>.82+.2*Math.sin(3*t+.6)+.12*Math.sin(5*t+2)},
 abstrak:{n:'Abstrak',k:'tidak beraturan (non-objective)',f:t=>.7+.3*Math.abs(Math.sin(2.5*t+.5))+.12*Math.sin(7*t+1)}
};
Object.values(SH).forEach(s=>{let a=0;for(let i=0;i<360;i++){const r=s.f(rad(i));a+=r*r/2*rad(1)}s.a=.8/Math.sqrt(a/Math.PI)});
const rr=(k,t)=>SH[k].f(t)*SH[k].a;
const PT=(r,cx,cy,sc,rot)=>Q(120,i=>{const t=i/120*2*Math.PI,q=r(t)*sc;return `${(cx+q*Math.cos(t+rot)).toFixed(1)},${(cy-q*Math.sin(t+rot)).toFixed(1)} `});
const AREA=r=>{let a=0;for(let i=0;i<360;i++){const q=r(rad(i));a+=q*q/2*rad(1)}return a};

/* ===== router & tema ===== */
const TITLES={
  beranda:"Nirmana — Belajar Dasar Desain",
  titik:"Titik — Nirmana",
  garis:"Garis — Nirmana",
  bidang:"Bidang & Bentuk — Nirmana",
  warna:"Warna — Nirmana",
  tekstur:"Tekstur — Nirmana"
};
const INIT={beranda:init_beranda, titik:init_titik, garis:init_garis, bidang:init_bidang, warna:init_warna, tekstur:init_tekstur};
const htmlEl=document.documentElement,app=document.getElementById('app'),views={};
let pending=null;
const isRoute=h=>Object.prototype.hasOwnProperty.call(TITLES,h);
const getRoute=()=>{const h=location.hash.slice(1);return isRoute(h)?h:'beranda'};

/* tema: satu pengaturan untuk semua halaman */
(function(){let t='dark';try{t=localStorage.getItem('theme')||'dark'}catch(e){}htmlEl.dataset.theme=t==='light'?'light':'dark'})();
function NirmanaToggleTheme(){
  const t=htmlEl.dataset.theme==='dark'?'light':'dark';
  htmlEl.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}
  Object.values(views).forEach(v=>v.host.dataset.theme=t);
}

function ensure(r){
  if(views[r])return views[r];
  const host=document.createElement('div');
  host.className='view';host.id='v-'+r;host.dataset.theme=htmlEl.dataset.theme;
  const sr=host.attachShadow({mode:'open'});
  sr.appendChild(document.getElementById('tpl-'+r).content.cloneNode(true));
  sr.addEventListener('click',onClick);
  sr.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest&&e.target.closest('[role="link"][data-go]');if(t)t.click()}});
  app.appendChild(host);
  views[r]={host,sr};
  INIT[r](sr);
  return views[r];
}

function render(){
  const r=getRoute(),v=ensure(r);
  Object.keys(views).forEach(k=>views[k].host.hidden=(k!==r));
  document.title=TITLES[r];
  const el=pending&&v.sr.getElementById(pending);pending=null;
  if(el)el.scrollIntoView({block:'start',behavior:'instant'});
  else scrollTo({top:0,left:0,behavior:'instant'});
  requestAnimationFrame(()=>{dispatchEvent(new Event('scroll'));dispatchEvent(new Event('resize'))});
}

function go(r,sec){
  pending=sec||null;
  const cur=location.hash.slice(1);
  if(cur===r||(r==='beranda'&&!cur))render();else location.hash=r;
}

function onClick(e){
  const t=e.target.closest&&e.target.closest('[data-go],[data-top],a[href^="#"]');
  if(!t)return;
  e.preventDefault();
  if(t.hasAttribute('data-top')){scrollTo({top:0});return}
  if(t.dataset.go){go(t.dataset.go,t.dataset.sec);return}
  const h=(t.getAttribute('href')||'').slice(1);
  if(!h)return;
  if(isRoute(h)){go(h);return}
  const el=t.getRootNode().getElementById(h);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}

addEventListener('hashchange',render);
render();

</script>
